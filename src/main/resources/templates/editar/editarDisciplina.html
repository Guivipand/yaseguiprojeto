<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar disciplina')}"></head>
<body class="pagina-form">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="card shadow-sm border-0">
        <div class="card-header">
            <h4 class="mb-0"><i class="bi bi-journal-text me-2"></i>Editar disciplina</h4>
        </div>
        <div class="card-body">
            <div class="alert alert-danger" th:if="${erroValidacao}"><i class="bi bi-exclamation-triangle-fill me-2"></i>Informe a matéria, o semestre e selecione o curso.</div>
            <form th:action="@{/atualizarDisciplina}" th:object="${disciplina}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label" for="materia">Matéria</label>
                    <input type="text" class="form-control" th:field="*{materia}" placeholder="Digite o nome da disciplina" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="semestre">Semestre</label>
                    <input type="number" class="form-control" th:field="*{semestre}" placeholder="Ex.: 1" min="1" step="1" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="curso">Curso</label>
                    <select class="form-select" th:field="*{curso}" required>
                        <option value="">Selecione o curso</option>
                        <option th:each="curso : ${cursos}" th:value="${curso.id}" th:text="${curso.titulo}"></option>
                    </select>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/listaDisciplinas}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Retornar</a>
                    <button type="submit" class="btn btn-success"><i class="bi bi-check-lg me-1"></i>Salvar alterações</button>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
