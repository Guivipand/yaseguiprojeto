<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar curso')}"></head>
<body class="pagina-form">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="card shadow-sm border-0">
        <div class="card-header">
            <h4 class="mb-0"><i class="bi bi-mortarboard-fill me-2"></i>Editar curso</h4>
        </div>
        <div class="card-body">
            <div class="alert alert-danger" th:if="${erroValidacao}"><i class="bi bi-exclamation-triangle-fill me-2"></i>Informe o título e a quantidade de semestres do curso.</div>
            <form th:action="@{/atualizarCurso}" th:object="${curso}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label" for="titulo">Título</label>
                    <input type="text" class="form-control" th:field="*{titulo}" placeholder="Ex.: Bacharelado em Ciência da Computação" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="qntSemestre">Quantidade de Semestres</label>
                    <input type="number" class="form-control" th:field="*{qntSemestre}" placeholder="Ex.: 8" min="1" step="1" required>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/listaCursos}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Retornar</a>
                    <button type="submit" class="btn btn-success"><i class="bi bi-check-lg me-1"></i>Salvar alterações</button>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
