<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar oferta de disciplina')}"></head>
<body class="pagina-form tema-oferta">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container conteudo conteudo-estreito">
    <header class="cabecalho-pagina">
        <nav aria-label="Trilha de navegação">
            <ol class="trilha">
                <li><a th:href="@{/}">Início</a></li>
                <li><a th:href="@{/listaOfertaDisciplinas}">Ofertas de disciplina</a></li>
                <li aria-current="page">Editar</li>
            </ol>
        </nav>
        <div class="cabecalho-titulo">
            <span class="selo-entidade" aria-hidden="true"><i class="bi bi-calendar-week-fill"></i></span>
            <div>
                <h1>Editar oferta de disciplina</h1>
                <p>Atualize os dados e salve as alterações.</p>
            </div>
        </div>
    </header>
    <form class="painel" th:action="@{/atualizarOfertaDisciplina}" th:object="${ofertaDisciplina}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="painel-corpo">
            <div class="alert alert-danger" role="alert" th:if="${erroValidacao}"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span>Selecione a disciplina e o professor.</span></div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="disciplina">Disciplina</label>
                    <select class="form-select" th:field="*{disciplina}" required>
                        <option value="">Selecione a disciplina</option>
                        <option th:each="disciplina : ${disciplinas}" th:value="${disciplina.id}" th:text="${disciplina.materia}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="professor">Professor</label>
                    <select class="form-select" th:field="*{professor}" required>
                        <option value="">Selecione o professor</option>
                        <option th:each="professor : ${professores}" th:value="${professor.id}" th:text="${professor.nome}"></option>
                    </select>
                </div>
            </div>
        </div>
        <div class="painel-acoes">
            <a th:href="@{/listaOfertaDisciplinas}" class="btn btn-quieto"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Retornar</a>
            <button type="submit" class="btn btn-tema"><i class="bi bi-check-lg me-2" aria-hidden="true"></i>Salvar alterações</button>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
