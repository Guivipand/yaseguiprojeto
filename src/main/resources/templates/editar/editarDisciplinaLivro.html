<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar referência')}"></head>
<body class="pagina-form tema-referencia">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container conteudo conteudo-estreito">
    <header class="cabecalho-pagina">
        <nav aria-label="Trilha de navegação">
            <ol class="trilha">
                <li><a th:href="@{/}">Início</a></li>
                <li><a th:href="@{/listaDisciplinaLivros}">Referências</a></li>
                <li aria-current="page">Editar</li>
            </ol>
        </nav>
        <div class="cabecalho-titulo">
            <span class="selo-entidade" aria-hidden="true"><i class="bi bi-bookmark-star-fill"></i></span>
            <div>
                <h1>Editar referência</h1>
                <p>Atualize os dados e salve as alterações.</p>
            </div>
        </div>
    </header>
    <form class="painel" th:action="@{/atualizarDisciplinaLivro}" th:object="${disciplinaLivro}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="painel-corpo">
            <div class="alert alert-danger" role="alert" th:if="${erroDisciplinaLivro}"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span>Selecione uma disciplina e um livro.</span></div>
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label" for="disciplina">Disciplina</label>
                    <select class="form-select" th:field="*{disciplina}" required>
                        <option value="">Selecione a disciplina</option>
                        <option th:each="disciplina : ${disciplinas}" th:value="${disciplina.id}" th:text="${disciplina.materia + (disciplina.curso != null ? ' - ' + disciplina.curso.titulo : '')}"></option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label" for="livro">Livro</label>
                    <select class="form-select" th:field="*{livro}" required>
                        <option value="">Selecione o livro</option>
                        <option th:each="livro : ${livros}" th:value="${livro.id}" th:text="${livro.titulo + ' - ' + livro.autor}"></option>
                    </select>
                </div>
            </div>
        </div>
        <div class="painel-acoes">
            <a th:href="@{/listaDisciplinaLivros}" class="btn btn-quieto"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Retornar</a>
            <button type="submit" class="btn btn-tema"><i class="bi bi-check-lg me-2" aria-hidden="true"></i>Salvar alterações</button>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
