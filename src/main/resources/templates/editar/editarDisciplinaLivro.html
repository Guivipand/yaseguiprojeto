<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar relação disciplina e livro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="pagina-form">
<div class="container">
    <div class="card shadow-sm">
        <div class="card-header"><h4 class="mb-0">Editar relação disciplina e livro</h4></div>
        <div class="card-body">
            <div class="alert alert-danger" th:if="${erroDisciplinaLivro}">Selecione uma disciplina e um livro.</div>
            <form th:action="@{/atualizarDisciplinaLivro}" th:object="${disciplinaLivro}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label">Disciplina</label>
                    <select class="form-select" th:field="*{disciplina}" required>
                        <option th:each="disciplina : ${disciplinas}" th:value="${disciplina.id}" th:text="${disciplina.materia + ' - ' + disciplina.curso.titulo}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Livro</label>
                    <select class="form-select" th:field="*{livro}" required>
                        <option th:each="livro : ${livros}" th:value="${livro.id}" th:text="${livro.titulo + ' - ' + livro.autor}"></option>
                    </select>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/listaDisciplinaLivros}" class="btn btn-secondary">Retornar</a>
                    <button type="submit" class="btn btn-success">Salvar alterações</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
