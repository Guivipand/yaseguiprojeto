<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar aluno')}"></head>
<body class="pagina-form">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="card shadow-sm border-0">
        <div class="card-header">
            <h4 class="mb-0"><i class="bi bi-people-fill me-2"></i>Editar aluno</h4>
        </div>
        <div class="card-body">
            <div class="alert alert-danger" th:if="${erroValidacao}"><i class="bi bi-exclamation-triangle-fill me-2"></i>Verifique os campos: todos são obrigatórios e o CPF e o e-mail precisam ser válidos.</div>
            <form th:action="@{/atualizarAluno}" th:object="${aluno}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label" for="idMatricula">Matrícula</label>
                    <input type="text" class="form-control" th:field="*{idMatricula}" placeholder="Digite a matrícula" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="nome">Nome</label>
                    <input type="text" class="form-control" th:field="*{nome}" placeholder="Digite o nome completo" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="endereco">Endereço</label>
                    <input type="text" class="form-control" th:field="*{endereco}" placeholder="Digite o endereço" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="cpf">CPF</label>
                    <input type="text" class="form-control" th:field="*{cpf}" placeholder="000.000.000-00" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">E-mail</label>
                    <input type="email" class="form-control" th:field="*{email}" placeholder="nome@exemplo.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="telefone">Telefone</label>
                    <input type="tel" class="form-control" th:field="*{telefone}" placeholder="(00) 00000-0000" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="dataNasc">Data de Nascimento</label>
                    <input type="date" class="form-control" th:field="*{dataNasc}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="semestre">Semestre</label>
                    <input type="number" class="form-control" th:field="*{semestre}" placeholder="Ex.: 1" min="1" step="1" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="curso">Curso</label>
                    <select class="form-select" th:field="*{curso}" required>
                        <option value="">Selecione o curso</option>
                        <option th:each="curso : ${cursos}" th:value="${curso.id}" th:text="${curso.titulo}"></option>
                    </select>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/listaAlunos}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Retornar</a>
                    <button type="submit" class="btn btn-success"><i class="bi bi-check-lg me-1"></i>Salvar alterações</button>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
