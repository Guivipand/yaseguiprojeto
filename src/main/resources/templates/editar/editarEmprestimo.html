<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar empréstimo')}"></head>
<body class="pagina-form">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="card shadow-sm border-0">
        <div class="card-header">
            <h4 class="mb-0"><i class="bi bi-arrow-left-right me-2"></i>Editar empréstimo</h4>
        </div>
        <div class="card-body">
            <div class="alert alert-danger" th:if="${erroDataPrevista}"><i class="bi bi-exclamation-triangle-fill me-2"></i>A devolução prevista ultrapassa o prazo permitido para as renovações.</div>
            <div class="alert alert-danger" th:if="${erroCamposEmprestimo}"><i class="bi bi-exclamation-triangle-fill me-2"></i>Informe o aluno.</div>
            <form th:action="@{/atualizarEmprestimo}" th:object="${emprestimo}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label">Exemplar</label>
                    <div class="form-control-plaintext" th:text="${emprestimo.exemplar.tombo + ' - ' + emprestimo.exemplar.livro.titulo}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="aluno">Aluno</label>
                    <select class="form-select" th:field="*{aluno}" required>
                        <option value="">Selecione o aluno</option>
                        <option th:each="aluno : ${alunos}" th:value="${aluno.id}" th:text="${aluno.nome}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="data_retirada">Data de retirada</label>
                    <input type="date" class="form-control" th:field="*{data_retirada}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="data_prevista">Data prevista para devolução</label>
                    <input type="date" class="form-control" th:field="*{data_prevista}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Renovações</label>
                    <div class="form-control-plaintext" th:text="${emprestimo.renovacoes + ' de 3'}"></div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/listaEmprestimos}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Retornar</a>
                    <button type="submit" class="btn btn-success"><i class="bi bi-check-lg me-1"></i>Salvar alterações</button>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    const dataRetirada = document.getElementById("data_retirada");
    const dataPrevista = document.getElementById("data_prevista");
    const sugerirDevolucao = () => {
        if (!dataRetirada.value) return;
        const [ano, mes, dia] = dataRetirada.value.split("-").map(Number);
        const prevista = new Date(ano, mes - 1, dia + 7);
        dataPrevista.value = `${prevista.getFullYear()}-${String(prevista.getMonth() + 1).padStart(2, "0")}-${String(prevista.getDate()).padStart(2, "0")}`;
    };
    dataRetirada.addEventListener("change", sugerirDevolucao);
</script>
</body>
</html>
