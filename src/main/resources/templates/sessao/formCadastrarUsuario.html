<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastrar Usuário')}"></head>
<body class="pagina-sessao">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container conteudo">
    <section class="cartao-sessao">
        <header class="sessao-cabecalho">
            <span class="selo-entidade" aria-hidden="true"><i class="bi bi-person-plus-fill"></i></span>
            <h1>Cadastrar Usuário</h1>
            <p>Escolha um login e uma senha para acessar o sistema.</p>
        </header>
        <form class="painel" th:action="@{/register}" method="post">
            <div class="painel-corpo">
                <fieldset class="campo-papel">
                    <legend class="form-label">Tipo de perfil:</legend>
                    <div class="escolha-papel">
                        <input type="radio" class="btn-check" name="role" id="perfilProfessor" value="PROFESSOR" required
                               th:checked="${roleSelecionado != null and roleSelecionado.name() == 'PROFESSOR'}">
                        <label class="opcao-papel tema-professor" for="perfilProfessor">
                            <span class="menu-icone" aria-hidden="true"><i class="bi bi-person-badge-fill"></i></span>Professor
                        </label>
                        <input type="radio" class="btn-check" name="role" id="perfilAluno" value="ALUNO"
                               th:checked="${roleSelecionado == null or roleSelecionado.name() == 'ALUNO'}">
                        <label class="opcao-papel tema-aluno" for="perfilAluno">
                            <span class="menu-icone" aria-hidden="true"><i class="bi bi-people-fill"></i></span>Aluno
                        </label>
                        <th:block th:if="${podeCadastrarAdmin}">
                            <input type="radio" class="btn-check" name="role" id="perfilAdmin" value="ADMIN"
                                   th:checked="${roleSelecionado != null and roleSelecionado.name() == 'ADMIN'}">
                            <label class="opcao-papel tema-curso" for="perfilAdmin">
                                <span class="menu-icone" aria-hidden="true"><i class="bi bi-shield-lock-fill"></i></span>Admin
                            </label>
                            <input type="radio" class="btn-check" name="role" id="perfilBibliotecario" value="BIBLIOTECARIO"
                                   th:checked="${roleSelecionado != null and roleSelecionado.name() == 'BIBLIOTECARIO'}">
                            <label class="opcao-papel tema-livro" for="perfilBibliotecario">
                                <span class="menu-icone" aria-hidden="true"><i class="bi bi-book-half"></i></span>Bibliotecário
                            </label>
                        </th:block>
                    </div>
                </fieldset>
                <div class="row g-3">
                    <div class="col-12" id="vinculoAluno">
                        <label class="form-label" for="aluno">Aluno ligado ao usuário:</label>
                        <select class="form-select" id="aluno" name="aluno" aria-describedby="ajudaAluno">
                            <option value="">Selecione o aluno</option>
                            <option th:each="item : ${alunosSemUsuario}" th:value="${item.id}" th:text="${item.nome + ' - ' + item.idMatricula}"
                                    th:selected="${alunoSelecionado == item.id}"></option>
                        </select>
                    <div class="col-12" id="vinculoProfessor">
                        <label class="form-label" for="professor">Professor ligado ao usuário:</label>
                        <select class="form-select" id="professor" name="professor" aria-describedby="ajudaProfessor">
                            <option value="">Selecione o professor</option>
                            <option th:each="item : ${professoresSemUsuario}" th:value="${item.id}" th:text="${item.nome + ' - ' + item.prontuario}"
                                    th:selected="${professorSelecionado == item.id}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="username">Login:</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Digite o login" autocomplete="username" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="password">Senha:</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Digite a senha" autocomplete="new-password" required>
                    </div>
                </div>

                <!-- ✅ Alertas de sucesso ou erro -->
                <div th:if="${mensagemSucesso}"
                     style="background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;
                            padding: 10px; border-radius: 5px; margin-top: 15px;">
                    <p th:text="${mensagemSucesso}"></p>
                </div>

                <div th:if="${erroUsuario}"
                     style="background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;
                            padding: 10px; border-radius: 5px; margin-top: 15px;">
                    <p th:text="${erroUsuario}"></p>
                </div>
            </div>
            <div class="painel-acoes">
                <a th:href="@{/login}" class="btn btn-quieto"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Retornar</a>
                <button type="submit" class="btn btn-tema"><i class="bi bi-check-lg me-2" aria-hidden="true"></i>Cadastrar</button>
            </div>
        </form>
        <p class="sessao-rodape">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    const vinculos = {
        ALUNO: document.getElementById("vinculoAluno"),
        PROFESSOR: document.getElementById("vinculoProfessor")
    };
    const atualizarVinculo = () => {
        const papel = document.querySelector("input[name='role']:checked")?.value;
        Object.entries(vinculos).forEach(([tipo, bloco]) => {
            const ativo = tipo === papel;
            const campo = bloco.querySelector("select");
            bloco.hidden = !ativo;
            campo.disabled = !ativo;
            campo.required = ativo;
        });
    };
    document.querySelectorAll("input[name='role']").forEach(opcao => opcao.addEventListener("change", atualizarVinculo));
    atualizarVinculo();
</script>
</body>
</html>
