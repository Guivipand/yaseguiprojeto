<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | Sistema de Matrícula'">Sistema de Matrícula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="bi bi-mortarboard-fill me-2"></i>Sistema de Matrícula</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}"><i class="bi bi-house-door-fill me-1"></i>Início</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-building me-1"></i>Acadêmico
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/listaCursos}"><i class="bi bi-mortarboard-fill me-2"></i>Cursos</a></li>
                        <li><a class="dropdown-item" th:href="@{/listaDisciplinas}"><i class="bi bi-journal-text me-2"></i>Disciplinas</a></li>
                        <li><a class="dropdown-item" th:href="@{/listaProfessores}"><i class="bi bi-person-badge-fill me-2"></i>Professores</a></li>
                        <li><a class="dropdown-item" th:href="@{/listaAlunos}"><i class="bi bi-people-fill me-2"></i>Alunos</a></li>
                        <li><a class="dropdown-item" th:href="@{/listaOfertaDisciplinas}"><i class="bi bi-calendar-week-fill me-2"></i>Ofertas de disciplina</a></li>
                        <li><a class="dropdown-item" th:href="@{/listaMatriculas}"><i class="bi bi-clipboard2-check-fill me-2"></i>Matrículas</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-bookshelf me-1"></i>Biblioteca
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/listaLivros}"><i class="bi bi-book-fill me-2"></i>Livros</a></li>
                        <li><a class="dropdown-item" th:href="@{/listaExemplares}"><i class="bi bi-upc-scan me-2"></i>Exemplares</a></li>
                        <li><a class="dropdown-item" th:href="@{/listaDisciplinaLivros}"><i class="bi bi-bookmark-star-fill me-2"></i>Referências</a></li>
                        <li><a class="dropdown-item" th:href="@{/listaEmprestimos}"><i class="bi bi-arrow-left-right me-2"></i>Empréstimos</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
