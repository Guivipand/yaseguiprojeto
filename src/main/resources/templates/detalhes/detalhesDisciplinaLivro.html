<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da relação disciplina e livro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="pagina-form">
<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container"><a class="navbar-brand" th:href="@{/}"><i class="bi bi-book-half me-2"></i>Sistema de Matrícula</a></div>
</nav>
<div class="container">
    <div class="card shadow-sm border-0">
        <div class="card-header"><h4 class="mb-0"><i class="bi bi-link-45deg me-2"></i>Detalhes da relação</h4></div>
        <div class="card-body">
            <div class="info"><span class="label">ID:</span> <span th:text="${disciplinaLivro.id}"></span></div>
            <div class="info"><span class="label">Disciplina:</span> <span th:text="${disciplinaLivro.disciplina.materia}"></span></div>
            <div class="info"><span class="label">Curso:</span> <span th:text="${disciplinaLivro.disciplina.curso.titulo}"></span></div>
            <div class="info"><span class="label">Livro:</span> <span th:text="${disciplinaLivro.livro.titulo}"></span></div>
            <div class="info"><span class="label">Autor:</span> <span th:text="${disciplinaLivro.livro.autor}"></span></div>
            <div class="info"><span class="label">ISBN:</span> <span th:text="${disciplinaLivro.livro.isbn}"></span></div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a th:href="@{/listaDisciplinaLivros}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Retornar</a>
                <a th:href="@{/editarDisciplinaLivro(id=${disciplinaLivro.id})}" class="btn btn-primary"><i class="bi bi-pencil-fill me-1"></i>Editar</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
