<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhes da referência')}"></head>
<body class="pagina-form">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="card shadow-sm border-0">
        <div class="card-header">
            <h4 class="mb-0"><i class="bi bi-bookmark-star-fill me-2"></i>Detalhes da referência</h4>
        </div>
        <div class="card-body">
            <div class="info"><span class="label">ID:</span> <span th:text="${disciplinaLivro.id}"></span></div>
            <div class="info"><span class="label">Disciplina:</span> <span th:text="${disciplinaLivro.disciplina.materia}"></span></div>
            <div class="info"><span class="label">Curso:</span> <span th:text="${disciplinaLivro.disciplina.curso != null ? disciplinaLivro.disciplina.curso.titulo : 'Sem curso'}"></span></div>
            <div class="info"><span class="label">Livro:</span> <span th:text="${disciplinaLivro.livro.titulo}"></span></div>
            <div class="info"><span class="label">Autor:</span> <span th:text="${disciplinaLivro.livro.autor}"></span></div>
            <div class="info"><span class="label">ISBN:</span> <span th:text="${disciplinaLivro.livro.isbn}"></span></div>
            <div class="d-flex flex-wrap justify-content-end gap-2 mt-4">
                <a th:href="@{/listaDisciplinaLivros}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Retornar</a>
                <a th:href="@{/editarDisciplinaLivro(id=${disciplinaLivro.id})}" class="btn btn-primary"><i class="bi bi-pencil-fill me-1"></i>Editar</a>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
