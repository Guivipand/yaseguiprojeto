<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhes da referência')}"></head>
<body class="pagina-detalhes tema-referencia">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container conteudo conteudo-estreito">
    <header class="cabecalho-pagina">
        <nav aria-label="Trilha de navegação">
            <ol class="trilha">
                <li><a th:href="@{/}">Início</a></li>
                <li><a th:href="@{/listaDisciplinaLivros}">Referências</a></li>
                <li aria-current="page">Detalhes</li>
            </ol>
        </nav>
        <div class="cabecalho-titulo">
            <span class="selo-entidade" aria-hidden="true"><i class="bi bi-bookmark-star-fill"></i></span>
            <div>
                <h1>Detalhes da referência</h1>
                <p>Livro indicado na bibliografia da disciplina.</p>
            </div>
        </div>
    </header>
    <section class="painel" aria-labelledby="ficha-nome">
        <div class="painel-corpo">
            <div class="ficha-topo">
                <div>
                    <p class="ficha-sobre">Referência de</p>
                    <h2 class="ficha-nome" id="ficha-nome" th:text="${disciplinaLivro.disciplina.materia}"></h2>
                </div>
                <span class="ficha-registro">Registro nº <span th:text="${disciplinaLivro.id}"></span></span>
            </div>
            <dl class="ficha-dados">
                <div><dt>Disciplina</dt><dd th:text="${disciplinaLivro.disciplina.materia}"></dd></div>
                <div><dt>Curso</dt><dd th:text="${disciplinaLivro.disciplina.curso != null ? disciplinaLivro.disciplina.curso.titulo : 'Sem curso'}"></dd></div>
                <div class="largo"><dt>Livro</dt><dd th:text="${disciplinaLivro.livro.titulo}"></dd></div>
                <div><dt>Autor</dt><dd th:text="${disciplinaLivro.livro.autor}"></dd></div>
                <div><dt>ISBN</dt><dd class="numero" th:text="${disciplinaLivro.livro.isbn}"></dd></div>
            </dl>
        </div>
        <div class="painel-acoes">
            <a th:href="@{/listaDisciplinaLivros}" class="btn btn-quieto"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Retornar</a>
            <a th:href="@{/editarDisciplinaLivro(id=${disciplinaLivro.id})}" class="btn btn-tema"><i class="bi bi-pencil me-2" aria-hidden="true"></i>Editar</a>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
