<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do empréstimo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="pagina-form">
<div class="container">
    <div class="card shadow-sm border-0">
        <div class="card-header"><h4 class="mb-0">Detalhes do empréstimo</h4></div>
        <div class="card-body">
            <div class="info"><span class="label">ID:</span> <span th:text="${emprestimo.id}"></span></div>
            <div class="info"><span class="label">Exemplar:</span> <span th:text="${emprestimo.exemplar.tombo + ' - ' + emprestimo.exemplar.livro.titulo}"></span></div>
            <div class="info"><span class="label">Aluno:</span> <span th:text="${emprestimo.aluno.nome}"></span></div>
            <div class="info"><span class="label">Data de retirada:</span> <span th:text="${emprestimo.data_retirada}"></span></div>
            <div class="info"><span class="label">Data prevista para devolução:</span> <span th:text="${emprestimo.data_prevista}"></span></div>
            <div class="info"><span class="label">Data de devolução:</span> <span th:text="${emprestimo.data_devolucao}"></span></div>
            <div class="info"><span class="label">Status:</span> <span th:text="${emprestimo.status}"></span></div>
            <div class="info"><span class="label">Renovações:</span> <span th:text="${emprestimo.renovacoes}"></span></div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a th:href="@{/listaEmprestimos}" class="btn btn-secondary">Retornar</a>
                <a th:href="@{/editarEmprestimo(id=${emprestimo.id})}" class="btn btn-primary">Editar</a>
                <form th:if="${emprestimo.podeRenovar}" th:action="@{/renovarEmprestimo}" method="post">
                    <input type="hidden" name="id" th:value="${emprestimo.id}">
                    <button type="submit" class="btn btn-warning"><i class="bi bi-arrow-clockwise me-1"></i>Renovar prazo</button>
                </form>
                <form th:if="${emprestimo.data_devolucao == null}" th:action="@{/devolverEmprestimo}" method="post">
                    <input type="hidden" name="id" th:value="${emprestimo.id}">
                    <button type="submit" class="btn btn-success">Registrar devolução</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
