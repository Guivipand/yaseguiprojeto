<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhes do empréstimo')}"></head>
<body class="pagina-form">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="card shadow-sm border-0">
        <div class="card-header">
            <h4 class="mb-0"><i class="bi bi-arrow-left-right me-2"></i>Detalhes do empréstimo</h4>
        </div>
        <div class="card-body">
            <div class="info"><span class="label">ID:</span> <span th:text="${emprestimo.id}"></span></div>
            <div class="info"><span class="label">Exemplar:</span> <span th:text="${emprestimo.exemplar.tombo + ' - ' + emprestimo.exemplar.livro.titulo}"></span></div>
            <div class="info"><span class="label">Aluno:</span> <span th:text="${emprestimo.aluno.nome}"></span></div>
            <div class="info"><span class="label">Data de retirada:</span> <span th:text="${emprestimo.data_retirada != null ? #temporals.format(emprestimo.data_retirada, 'dd/MM/yyyy') : '-'}"></span></div>
            <div class="info"><span class="label">Data prevista para devolução:</span> <span th:text="${emprestimo.data_prevista != null ? #temporals.format(emprestimo.data_prevista, 'dd/MM/yyyy') : '-'}"></span></div>
            <div class="info"><span class="label">Data de devolução:</span> <span th:text="${emprestimo.data_devolucao != null ? #temporals.format(emprestimo.data_devolucao, 'dd/MM/yyyy') : '-'}"></span></div>
            <div class="info"><span class="label">Status:</span> <span class="badge text-bg-danger" th:if="${emprestimo.data_devolucao == null and emprestimo.data_prevista != null and emprestimo.data_prevista.isBefore(#temporals.createToday())}">Atrasado</span><span class="badge" th:unless="${emprestimo.data_devolucao == null and emprestimo.data_prevista != null and emprestimo.data_prevista.isBefore(#temporals.createToday())}" th:classappend="${emprestimo.data_devolucao == null} ? 'text-bg-primary' : 'text-bg-success'" th:text="${emprestimo.status}"></span></div>
            <div class="info"><span class="label">Renovações:</span> <span th:text="${emprestimo.renovacoes + ' de 3'}"></span></div>
            <div class="d-flex flex-wrap justify-content-end gap-2 mt-4">
                <a th:href="@{/listaEmprestimos}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Retornar</a>
                <a th:href="@{/editarEmprestimo(id=${emprestimo.id})}" class="btn btn-primary" th:if="${emprestimo.data_devolucao == null}"><i class="bi bi-pencil-fill me-1"></i>Editar</a>
                <form th:if="${emprestimo.podeRenovar()}" th:action="@{/renovarEmprestimo}" method="post">
                    <input type="hidden" name="id" th:value="${emprestimo.id}">
                    <button type="submit" class="btn btn-warning"><i class="bi bi-arrow-clockwise me-1"></i>Renovar prazo</button>
                </form>
                <form th:if="${emprestimo.data_devolucao == null}" th:action="@{/devolverEmprestimo}" method="post">
                    <input type="hidden" name="id" th:value="${emprestimo.id}">
                    <button type="submit" class="btn btn-success"><i class="bi bi-box-arrow-in-down me-1"></i>Registrar devolução</button>
                </form>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
