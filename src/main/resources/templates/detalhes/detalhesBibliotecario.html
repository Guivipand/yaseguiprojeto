<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhes do bibliotecário')}"></head>
<body class="pagina-detalhes tema-bibliotecario">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container conteudo conteudo-estreito">
    <header class="cabecalho-pagina">
        <nav aria-label="Trilha de navegação">
            <ol class="trilha">
                <li><a th:href="@{/}">Início</a></li>
                <li><a th:href="@{/listaBibliotecarios}">Bibliotecários</a></li>
                <li aria-current="page">Detalhes</li>
            </ol>
        </nav>
        <div class="cabecalho-titulo">
            <span class="selo-entidade" aria-hidden="true"><i class="bi bi-person-workspace"></i></span>
            <div>
                <h1>Detalhes do bibliotecário</h1>
                <p>Ficha cadastral completa do bibliotecário.</p>
            </div>
        </div>
    </header>
    <section class="painel" aria-labelledby="ficha-nome">
        <div class="painel-corpo">
            <div class="ficha-topo">
                <div>
                    <p class="ficha-sobre">Bibliotecário</p>
                    <h2 class="ficha-nome" id="ficha-nome" th:text="${bibliotecario.nome}"></h2>
                </div>
                <span class="ficha-registro">Registro nº <span th:text="${bibliotecario.id}"></span></span>
            </div>
            <dl class="ficha-dados">
                <div><dt>Prontuário</dt><dd class="numero" th:text="${bibliotecario.prontuario}"></dd></div>
                <div><dt>Registro CRB</dt><dd th:text="${bibliotecario.crb}"></dd></div>
                <div><dt>CPF</dt><dd class="numero" th:text="${bibliotecario.cpf}"></dd></div>
                <div><dt>Data de Nascimento</dt><dd class="numero" th:text="${bibliotecario.dataNasc != null ? #temporals.format(bibliotecario.dataNasc, 'dd/MM/yyyy') : '-'}"></dd></div>
                <div><dt>E-mail</dt><dd th:text="${bibliotecario.email}"></dd></div>
                <div><dt>Telefone</dt><dd class="numero" th:text="${bibliotecario.telefone}"></dd></div>
                <div class="largo"><dt>Endereço</dt><dd th:text="${bibliotecario.endereco}"></dd></div>
            </dl>
        </div>
        <div class="painel-acoes">
            <a th:href="@{/listaBibliotecarios}" class="btn btn-quieto"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Retornar</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/editarBibliotecario(id=${bibliotecario.id})}" class="btn btn-tema"><i class="bi bi-pencil me-2" aria-hidden="true"></i>Editar</a>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
