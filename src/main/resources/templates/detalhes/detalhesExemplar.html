<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhes do exemplar')}"></head>
<body class="pagina-detalhes tema-exemplar">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container conteudo conteudo-estreito">
    <header class="cabecalho-pagina">
        <nav aria-label="Trilha de navegação">
            <ol class="trilha">
                <li><a th:href="@{/}">Início</a></li>
                <li><a th:href="@{/listaExemplares}">Exemplares</a></li>
                <li aria-current="page">Detalhes</li>
            </ol>
        </nav>
        <div class="cabecalho-titulo">
            <span class="selo-entidade" aria-hidden="true"><i class="bi bi-upc-scan"></i></span>
            <div>
                <h1>Detalhes do exemplar</h1>
                <p>Cópia física do acervo e sua situação atual.</p>
            </div>
        </div>
    </header>
    <section class="painel" aria-labelledby="ficha-nome">
        <div class="painel-corpo">
            <div class="ficha-topo">
                <div>
                    <p class="ficha-sobre">Exemplar</p>
                    <h2 class="ficha-nome" id="ficha-nome" th:text="${exemplar.livro.titulo}"></h2>
                </div>
                <span class="ficha-registro">Registro nº <span th:text="${exemplar.id}"></span></span>
            </div>
            <dl class="ficha-dados">
                <div><dt>Tombo</dt><dd class="numero" th:text="${exemplar.tombo}"></dd></div>
                <div><dt>Status</dt><dd><span class="selo" th:classappend="${exemplar.status == 'Disponível'} ? 'selo-ok' : 'selo-neutro'" th:text="${exemplar.status}"></span></dd></div>
                <div class="largo"><dt>Livro</dt><dd th:text="${exemplar.livro.titulo}"></dd></div>
            </dl>
        </div>
        <div class="painel-acoes">
            <a th:href="@{/listaExemplares}" class="btn btn-quieto"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Retornar</a>
            <a th:href="@{/editarExemplar(id=${exemplar.id})}" class="btn btn-tema"><i class="bi bi-pencil me-2" aria-hidden="true"></i>Editar</a>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
