<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhes do exemplar')}"></head>
<body class="pagina-form">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="card shadow-sm border-0">
        <div class="card-header">
            <h4 class="mb-0"><i class="bi bi-upc-scan me-2"></i>Detalhes do exemplar</h4>
        </div>
        <div class="card-body">
            <div class="info"><span class="label">ID:</span> <span th:text="${exemplar.id}"></span></div>
            <div class="info"><span class="label">Livro:</span> <span th:text="${exemplar.livro.titulo}"></span></div>
            <div class="info"><span class="label">Tombo:</span> <span th:text="${exemplar.tombo}"></span></div>
            <div class="info"><span class="label">Status:</span> <span class="badge" th:classappend="${exemplar.status == 'Disponível'} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${exemplar.status}"></span></div>
            <div class="d-flex flex-wrap justify-content-end gap-2 mt-4">
                <a th:href="@{/listaExemplares}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Retornar</a>
                <a th:href="@{/editarExemplar(id=${exemplar.id})}" class="btn btn-primary"><i class="bi bi-pencil-fill me-1"></i>Editar</a>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
