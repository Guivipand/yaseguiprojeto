<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do exemplar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="pagina-form">
<div class="container">
    <div class="card shadow-sm border-0">
        <div class="card-header"><h4 class="mb-0">Detalhes do exemplar</h4></div>
        <div class="card-body">
            <div class="info"><span class="label">ID:</span> <span th:text="${exemplar.id}"></span></div>
            <div class="info"><span class="label">Livro:</span> <span th:text="${exemplar.livro.titulo}"></span></div>
            <div class="info"><span class="label">Tombo:</span> <span th:text="${exemplar.tombo}"></span></div>
            <div class="info"><span class="label">Status:</span> <span th:text="${exemplar.status}"></span></div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a th:href="@{/listaExemplares}" class="btn btn-secondary">Retornar</a>
                <a th:href="@{/editarExemplar(id=${exemplar.id})}" class="btn btn-primary">Editar</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
