<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhes do aluno')}"></head>
<body class="pagina-form">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="card shadow-sm border-0">
        <div class="card-header">
            <h4 class="mb-0"><i class="bi bi-people-fill me-2"></i>Detalhes do aluno</h4>
        </div>
        <div class="card-body">
            <div class="info"><span class="label">ID:</span> <span th:text="${aluno.id}"></span></div>
            <div class="info"><span class="label">Matrícula:</span> <span th:text="${aluno.idMatricula}"></span></div>
            <div class="info"><span class="label">Nome:</span> <span th:text="${aluno.nome}"></span></div>
            <div class="info"><span class="label">Endereço:</span> <span th:text="${aluno.endereco}"></span></div>
            <div class="info"><span class="label">CPF:</span> <span th:text="${aluno.cpf}"></span></div>
            <div class="info"><span class="label">E-mail:</span> <span th:text="${aluno.email}"></span></div>
            <div class="info"><span class="label">Telefone:</span> <span th:text="${aluno.telefone}"></span></div>
            <div class="info"><span class="label">Data de Nascimento:</span> <span th:text="${aluno.dataNasc != null ? #temporals.format(aluno.dataNasc, 'dd/MM/yyyy') : '-'}"></span></div>
            <div class="info"><span class="label">Semestre:</span> <span th:text="${aluno.semestre}"></span></div>
            <div class="info"><span class="label">Curso:</span> <span th:text="${aluno.curso != null ? aluno.curso.titulo : 'Sem curso'}"></span></div>
            <div class="d-flex flex-wrap justify-content-end gap-2 mt-4">
                <a th:href="@{/listaAlunos}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Retornar</a>
                <a th:href="@{/editarAluno(id=${aluno.id})}" class="btn btn-primary"><i class="bi bi-pencil-fill me-1"></i>Editar</a>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
