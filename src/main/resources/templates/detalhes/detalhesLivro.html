<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhes do livro')}"></head>
<body class="pagina-form">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="card shadow-sm border-0">
        <div class="card-header">
            <h4 class="mb-0"><i class="bi bi-book-fill me-2"></i>Detalhes do livro</h4>
        </div>
        <div class="card-body">
            <div class="info"><span class="label">ID:</span> <span th:text="${livro.id}"></span></div>
            <div class="info"><span class="label">Título:</span> <span th:text="${livro.titulo}"></span></div>
            <div class="info"><span class="label">Autor:</span> <span th:text="${livro.autor}"></span></div>
            <div class="info"><span class="label">Editora:</span> <span th:text="${livro.editora}"></span></div>
            <div class="info"><span class="label">ISBN:</span> <span th:text="${livro.isbn}"></span></div>
            <div class="info"><span class="label">Edição:</span> <span th:text="${livro.edicao}"></span></div>
            <div class="info"><span class="label">Ano:</span> <span th:text="${livro.ano}"></span></div>
            <div class="info"><span class="label">Sinopse:</span> <span th:text="${livro.sinopse}"></span></div>
            <div class="info" th:if="${livro.capa_imagem != null}">
                <span class="label">Capa:</span>
                <img th:src="@{'/' + ${livro.capa_imagem}}" th:alt="${'Capa de ' + livro.titulo}" class="capa-livro mt-2">
            </div>
            <div class="d-flex flex-wrap justify-content-end gap-2 mt-4">
                <a th:href="@{/listaLivros}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Retornar</a>
                <a th:href="@{/editarLivro(id=${livro.id})}" class="btn btn-primary"><i class="bi bi-pencil-fill me-1"></i>Editar</a>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
