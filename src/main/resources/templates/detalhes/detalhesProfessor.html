<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalhes do Professor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .container {
            max-width: 760px;
            margin-top: 40px;
        }

        .card-header {
            background-color: #3457D5;
            color: #fff;
        }

        .info {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .info:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;
            color: #555;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-mortarboard-fill me-2"></i>
            Sistema de Matrícula
        </a>
    </div>
</nav>

<div class="container">

    <div class="card shadow-sm border-0">

        <div class="card-header">
            <h4 class="mb-0">
                <i class="bi bi-person-badge-fill me-2"></i>
                Detalhes do Professor
            </h4>
        </div>

        <div class="card-body">

            <div class="info">
                <span class="label">ID:</span>
                <span th:text="${professor.id}"></span>
            </div>

            <div class="info">
                <span class="label">Prontuário:</span>
                <span th:text="${professor.prontuario}"></span>
            </div>

            <div class="info">
                <span class="label">Nome:</span>
                <span th:text="${professor.nome}"></span>
            </div>

            <div class="info">
                <span class="label">Endereço:</span>
                <span th:text="${professor.endereco}"></span>
            </div>

            <div class="info">
                <span class="label">CPF:</span>
                <span th:text="${professor.cpf}"></span>
            </div>

            <div class="info">
                <span class="label">E-mail:</span>
                <span th:text="${professor.email}"></span>
            </div>

            <div class="info">
                <span class="label">Telefone:</span>
                <span th:text="${professor.telefone}"></span>
            </div>

            <div class="info">
                <span class="label">Data de Nascimento:</span>
                <span th:text="${professor.dataNasc}"></span>
            </div>

            <div class="info">
                <span class="label">Formação:</span>
                <span th:text="${professor.formacao}"></span>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">

                <a th:href="@{/listaProfessores}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Retornar
                </a>

                <a th:href="@{/editarProfessor(id=${professor.id})}" class="btn btn-primary">
                    <i class="bi bi-pencil-fill me-1"></i>
                    Editar
                </a>

            </div>

        </div>
    </div>
</div>

</body>
</html>
