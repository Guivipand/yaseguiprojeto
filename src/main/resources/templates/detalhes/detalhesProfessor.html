<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhes do professor')}"></head>
<body class="pagina-form">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="card shadow-sm border-0">
        <div class="card-header">
            <h4 class="mb-0"><i class="bi bi-person-badge-fill me-2"></i>Detalhes do professor</h4>
        </div>
        <div class="card-body">
            <div class="info"><span class="label">ID:</span> <span th:text="${professor.id}"></span></div>
            <div class="info"><span class="label">Prontuário:</span> <span th:text="${professor.prontuario}"></span></div>
            <div class="info"><span class="label">Nome:</span> <span th:text="${professor.nome}"></span></div>
            <div class="info"><span class="label">Endereço:</span> <span th:text="${professor.endereco}"></span></div>
            <div class="info"><span class="label">CPF:</span> <span th:text="${professor.cpf}"></span></div>
            <div class="info"><span class="label">E-mail:</span> <span th:text="${professor.email}"></span></div>
            <div class="info"><span class="label">Telefone:</span> <span th:text="${professor.telefone}"></span></div>
            <div class="info"><span class="label">Data de Nascimento:</span> <span th:text="${professor.dataNasc != null ? #temporals.format(professor.dataNasc, 'dd/MM/yyyy') : '-'}"></span></div>
            <div class="info"><span class="label">Formação:</span> <span th:text="${professor.formacao}"></span></div>
            <div class="d-flex flex-wrap justify-content-end gap-2 mt-4">
                <a th:href="@{/listaProfessores}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Retornar</a>
                <a th:href="@{/editarProfessor(id=${professor.id})}" class="btn btn-primary"><i class="bi bi-pencil-fill me-1"></i>Editar</a>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
