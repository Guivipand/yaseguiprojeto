<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Professores')}"></head>
<body class="pagina-lista tema-professor">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container conteudo">
    <header class="cabecalho-pagina">
        <nav aria-label="Trilha de navegação">
            <ol class="trilha">
                <li><a th:href="@{/}">Início</a></li>
                <li aria-current="page">Professores</li>
            </ol>
        </nav>
        <div class="cabecalho-linha">
            <div class="cabecalho-titulo">
                <span class="selo-entidade" aria-hidden="true"><i class="bi bi-person-badge-fill"></i></span>
                <div>
                    <h1>Professores</h1>
                    <p>Professores cadastrados.</p>
                </div>
            </div>
            <a th:href="@{/formularioProfessor}" class="btn btn-tema"><i class="bi bi-plus-lg me-2" aria-hidden="true"></i>Novo professor</a>
        </div>
    </header>
    <div class="alert alert-danger" role="alert" th:if="${erroExclusao}">
        <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span>Não foi possível excluir: existem outros registros vinculados a este item.</span>
    </div>
    <div class="painel-tabela">
        <div class="table-responsive">
            <table class="table table-hover align-middle tabela">
                <thead>
                <tr>
                    <th scope="col" class="col-id">#</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Prontuário</th>
                    <th scope="col">Formação</th>
                    <th scope="col" class="col-acoes text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="professor : ${professores}">
                    <td data-label="Nº" class="col-id" th:text="${professor.id}"></td>
                    <td data-label="Nome" class="celula-principal" th:text="${professor.nome}"></td>
                    <td data-label="Prontuário" class="numero" th:text="${professor.prontuario}"></td>
                    <td data-label="Formação" th:text="${professor.formacao}"></td>
                    <td class="col-acoes">
                        <div class="acoes">
                            <a th:href="@{/editarProfessor(id=${professor.id})}" class="btn btn-icon" title="Editar" aria-label="Editar"><i class="bi bi-pencil" aria-hidden="true"></i></a>
                            <a th:href="@{/detalhesProfessor(id=${professor.id})}" class="btn btn-icon" title="Detalhes" aria-label="Detalhes"><i class="bi bi-eye" aria-hidden="true"></i></a>
                            <a th:href="@{/excluirProfessor(id=${professor.id})}" class="btn btn-icon btn-perigo" title="Excluir" aria-label="Excluir"
                               onclick="return confirm('Deseja realmente excluir este registro?')"><i class="bi bi-trash3" aria-hidden="true"></i></a>
                        </div>
                    </td>
                </tr>
                <tr class="linha-vazia" th:if="${#lists.isEmpty(professores)}">
                    <td colspan="5">
                        <div class="vazio">
                            <span class="vazio-icone" aria-hidden="true"><i class="bi bi-person-badge-fill"></i></span>
                            <p class="vazio-titulo">Nenhum professor cadastrado ainda.</p>
                            <p class="vazio-texto">Use o botão “Novo professor” para fazer o primeiro cadastro.</p>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
