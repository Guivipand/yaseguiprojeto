<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Oferta de Disciplinas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="bi bi-clipboard2-data-fill me-2"></i>Sistema de Matrícula</a>
    </div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Ofertas de Disciplina</h2>
            <p class="text-muted mb-0">Lista de ofertas de disciplina cadastradas.</p>
        </div>
        <a th:href="@{/formularioOfertaDisciplina}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nova Oferta</a>
    </div>
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Disciplina</th>
                    <th>Professor</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="oferta : ${ofertasDisciplina}">
                    <td th:text="${oferta.id}"></td>
                    <td th:text="${oferta.disciplina != null ? oferta.disciplina.materia : 'Sem disciplina'}"></td>
                    <td th:text="${oferta.professor != null ? oferta.professor.nome : 'Sem professor'}"></td>
                    <td class="text-end">
                        <a th:href="@{/editarOfertaDisciplina(id=${oferta.id})}" class="btn btn-outline-secondary btn-icon" title="Editar"><i class="bi bi-pencil-fill"></i></a>
                        <a th:href="@{/excluirOfertaDisciplina(id=${oferta.id})}" class="btn btn-outline-danger btn-icon" title="Excluir"><i class="bi bi-trash-fill"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ofertasDisciplina)}">
                    <td colspan="4" class="text-center text-muted py-4">Nenhuma oferta cadastrada ainda.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
