<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de exemplares</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container"><a class="navbar-brand" th:href="@{/}">Sistema de Matrícula</a></div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><h2 class="fw-bold mb-0">Exemplares</h2><p class="text-muted mb-0">Lista de exemplares cadastrados.</p></div>
        <a th:href="@{/formularioExemplar}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Novo exemplar</a>
    </div>
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>#</th><th>Livro</th><th>Tombo</th><th>Status</th><th class="text-end">Ações</th></tr></thead>
                <tbody>
                <tr th:each="exemplar : ${exemplares}">
                    <td th:text="${exemplar.id}"></td>
                    <td th:text="${exemplar.livro.titulo}"></td>
                    <td th:text="${exemplar.tombo}"></td>
                    <td th:text="${exemplar.status}"></td>
                    <td class="text-end">
                        <a th:href="@{/editarExemplar(id=${exemplar.id})}" class="btn btn-outline-secondary btn-icon" title="Editar"><i class="bi bi-pencil-fill"></i></a>
                        <a th:href="@{/detalhesExemplar(id=${exemplar.id})}" class="btn btn-outline-info btn-icon" title="Detalhes"><i class="bi bi-info-circle-fill"></i></a>
                        <a th:href="@{/excluirExemplar(id=${exemplar.id})}" class="btn btn-outline-danger btn-icon" title="Excluir"><i class="bi bi-trash-fill"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(exemplares)}"><td colspan="5" class="text-center text-muted py-4">Nenhum exemplar cadastrado ainda.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
