<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Disciplinas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Disciplinas</h2>
            <p class="text-muted mb-0">Disciplinas da matriz curricular de cada curso.</p>
        </div>
        <a th:href="@{/formularioDisciplina}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nova disciplina</a>
    </div>
    <div class="alert alert-danger" th:if="${erroExclusao}">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>Não foi possível excluir: existem outros registros vinculados a este item.
    </div>
    <div class="card shadow-sm border-0">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Matéria</th>
                    <th>Semestre</th>
                    <th>Curso</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="disciplina : ${disciplinas}">
                    <td th:text="${disciplina.id}"></td>
                    <td th:text="${disciplina.materia}"></td>
                    <td th:text="${disciplina.semestre}"></td>
                    <td th:text="${disciplina.curso != null ? disciplina.curso.titulo : 'Sem curso'}"></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/editarDisciplina(id=${disciplina.id})}" class="btn btn-outline-secondary btn-icon" title="Editar"><i class="bi bi-pencil-fill"></i></a>
                        <a th:href="@{/excluirDisciplina(id=${disciplina.id})}" class="btn btn-outline-danger btn-icon" title="Excluir"
                           onclick="return confirm('Deseja realmente excluir este registro?')"><i class="bi bi-trash-fill"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(disciplinas)}">
                    <td colspan="5" class="text-center text-muted py-4">Nenhuma disciplina cadastrada ainda.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
