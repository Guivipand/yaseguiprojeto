<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de empréstimos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container"><a class="navbar-brand" th:href="@{/}">Sistema de Matrícula</a></div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><h2 class="fw-bold mb-0">Empréstimos</h2><p class="text-muted mb-0">Lista de empréstimos cadastrados.</p></div>
        <a th:href="@{/formularioEmprestimo}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Novo empréstimo</a>
    </div>
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>#</th><th>Livro / Exemplar</th><th>Aluno</th><th>Retirada</th><th>Devolução prevista</th><th>Status</th><th class="text-end">Ações</th></tr></thead>
                <tbody>
                <tr th:each="emprestimo : ${emprestimos}">
                    <td th:text="${emprestimo.id}"></td>
                    <td th:text="${emprestimo.exemplar.livro.titulo + ' / ' + emprestimo.exemplar.tombo}"></td>
                    <td th:text="${emprestimo.aluno.nome}"></td>
                    <td th:text="${emprestimo.data_retirada}"></td>
                    <td th:text="${emprestimo.data_prevista}"></td>
                    <td th:text="${emprestimo.status}"></td>
                    <td class="text-end">
                        <a th:href="@{/editarEmprestimo(id=${emprestimo.id})}" class="btn btn-outline-secondary btn-icon" title="Editar"><i class="bi bi-pencil-fill"></i></a>
                        <a th:href="@{/detalhesEmprestimo(id=${emprestimo.id})}" class="btn btn-outline-info btn-icon" title="Detalhes"><i class="bi bi-info-circle-fill"></i></a>
                        <a th:href="@{/excluirEmprestimo(id=${emprestimo.id})}" class="btn btn-outline-danger btn-icon" title="Excluir"><i class="bi bi-trash-fill"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(emprestimos)}"><td colspan="7" class="text-center text-muted py-4">Nenhum empréstimo cadastrado ainda.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
