<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Empréstimos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Empréstimos</h2>
            <p class="text-muted mb-0">Retiradas e devoluções de exemplares.</p>
        </div>
        <a th:href="@{/formularioEmprestimo}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Novo empréstimo</a>
    </div>
    <div class="alert alert-danger" th:if="${erroExclusao}">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>Não foi possível excluir: existem outros registros vinculados a este item.
    </div>
    <div class="card shadow-sm border-0">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Livro / Exemplar</th>
                    <th>Aluno</th>
                    <th>Retirada</th>
                    <th>Devolução prevista</th>
                    <th>Status</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emprestimo : ${emprestimos}">
                    <td th:text="${emprestimo.id}"></td>
                    <td th:text="${emprestimo.exemplar.livro.titulo + ' / ' + emprestimo.exemplar.tombo}"></td>
                    <td th:text="${emprestimo.aluno.nome}"></td>
                    <td th:text="${emprestimo.data_retirada != null ? #temporals.format(emprestimo.data_retirada, 'dd/MM/yyyy') : '-'}"></td>
                    <td th:text="${emprestimo.data_prevista != null ? #temporals.format(emprestimo.data_prevista, 'dd/MM/yyyy') : '-'}"></td>
                    <td><span class="badge text-bg-danger" th:if="${emprestimo.data_devolucao == null and emprestimo.data_prevista != null and emprestimo.data_prevista.isBefore(#temporals.createToday())}">Atrasado</span><span class="badge" th:unless="${emprestimo.data_devolucao == null and emprestimo.data_prevista != null and emprestimo.data_prevista.isBefore(#temporals.createToday())}" th:classappend="${emprestimo.data_devolucao == null} ? 'text-bg-primary' : 'text-bg-success'" th:text="${emprestimo.status}"></span></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/editarEmprestimo(id=${emprestimo.id})}" class="btn btn-outline-secondary btn-icon" title="Editar"><i class="bi bi-pencil-fill"></i></a>
                        <a th:href="@{/detalhesEmprestimo(id=${emprestimo.id})}" class="btn btn-outline-info btn-icon" title="Detalhes"><i class="bi bi-info-circle-fill"></i></a>
                        <a th:href="@{/excluirEmprestimo(id=${emprestimo.id})}" class="btn btn-outline-danger btn-icon" title="Excluir"
                           onclick="return confirm('Deseja realmente excluir este registro?')"><i class="bi bi-trash-fill"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(emprestimos)}">
                    <td colspan="7" class="text-center text-muted py-4">Nenhum empréstimo cadastrado ainda.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
