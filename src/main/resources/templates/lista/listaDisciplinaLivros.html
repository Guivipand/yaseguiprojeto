<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Disciplinas e livros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container"><a class="navbar-brand" th:href="@{/}"><i class="bi bi-book-half me-2"></i>Sistema de Matrícula</a></div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><h2 class="fw-bold mb-0">Disciplinas e livros</h2><p class="text-muted mb-0">Livros relacionados a cada disciplina.</p></div>
        <a th:href="@{/formularioDisciplinaLivro}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nova relação</a>
    </div>
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>#</th><th>Disciplina</th><th>Livro</th><th class="text-end">Ações</th></tr></thead>
                <tbody>
                <tr th:each="relacao : ${disciplinaLivros}">
                    <td th:text="${relacao.id}"></td>
                    <td th:text="${relacao.disciplina.materia}"></td>
                    <td th:text="${relacao.livro.titulo}"></td>
                    <td class="text-end">
                        <a th:href="@{/editarDisciplinaLivro(id=${relacao.id})}" class="btn btn-outline-secondary btn-icon" title="Editar"><i class="bi bi-pencil-fill"></i></a>
                        <a th:href="@{/detalhesDisciplinaLivro(id=${relacao.id})}" class="btn btn-outline-info btn-icon" title="Detalhes"><i class="bi bi-info-circle-fill"></i></a>
                        <a th:href="@{/excluirDisciplinaLivro(id=${relacao.id})}" class="btn btn-outline-danger btn-icon" title="Excluir"><i class="bi bi-trash-fill"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(disciplinaLivros)}"><td colspan="4" class="text-center text-muted py-4">Nenhuma relação cadastrada ainda.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
