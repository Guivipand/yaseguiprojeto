<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Referências')}"></head>
<body class="pagina-lista tema-referencia">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container conteudo">
    <header class="cabecalho-pagina">
        <nav aria-label="Trilha de navegação">
            <ol class="trilha">
                <li><a th:href="@{/}">Início</a></li>
                <li aria-current="page">Referências</li>
            </ol>
        </nav>
        <div class="cabecalho-linha">
            <div class="cabecalho-titulo">
                <span class="selo-entidade" aria-hidden="true"><i class="bi bi-bookmark-star-fill"></i></span>
                <div>
                    <h1>Referências</h1>
                    <p>Livros de referência de cada disciplina.</p>
                </div>
            </div>
            <a th:href="@{/formularioDisciplinaLivro}" class="btn btn-tema"><i class="bi bi-plus-lg me-2" aria-hidden="true"></i>Nova referência</a>
        </div>
    </header>
    <div class="alert alert-danger" role="alert" th:if="${erroExclusao}">
        <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span>Não foi possível excluir: existem outros registros vinculados a este item.</span>
    </div>
    <div class="painel-tabela">
        <div class="table-responsive">
            <table class="table table-hover align-middle tabela">
                <thead>
                <tr>
                    <th scope="col" class="col-id">#</th>
                    <th scope="col">Disciplina</th>
                    <th scope="col">Livro</th>
                    <th scope="col" class="col-acoes text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="relacao : ${disciplinaLivros}">
                    <td data-label="Nº" class="col-id" th:text="${relacao.id}"></td>
                    <td data-label="Disciplina" class="celula-principal" th:text="${relacao.disciplina.materia}"></td>
                    <td data-label="Livro" th:text="${relacao.livro.titulo}"></td>
                    <td class="col-acoes">
                        <div class="acoes">
                            <a th:href="@{/editarDisciplinaLivro(id=${relacao.id})}" class="btn btn-icon" title="Editar" aria-label="Editar"><i class="bi bi-pencil" aria-hidden="true"></i></a>
                            <a th:href="@{/detalhesDisciplinaLivro(id=${relacao.id})}" class="btn btn-icon" title="Detalhes" aria-label="Detalhes"><i class="bi bi-eye" aria-hidden="true"></i></a>
                            <a th:href="@{/excluirDisciplinaLivro(id=${relacao.id})}" class="btn btn-icon btn-perigo" title="Excluir" aria-label="Excluir"
                               onclick="return confirm('Deseja realmente excluir este registro?')"><i class="bi bi-trash3" aria-hidden="true"></i></a>
                        </div>
                    </td>
                </tr>
                <tr class="linha-vazia" th:if="${#lists.isEmpty(disciplinaLivros)}">
                    <td colspan="4">
                        <div class="vazio">
                            <span class="vazio-icone" aria-hidden="true"><i class="bi bi-bookmark-star-fill"></i></span>
                            <p class="vazio-titulo">Nenhuma referência cadastrada ainda.</p>
                            <p class="vazio-texto">Use o botão “Nova referência” para fazer o primeiro cadastro.</p>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
