<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Matrículas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="bi bi-card-list me-2"></i>Sistema de Matrícula</a>
    </div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Matrículas</h2>
            <p class="text-muted mb-0">Lista de matrículas cadastradas.</p>
        </div>
        <a th:href="@{/formularioMatricula}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nova Matrícula</a>
    </div>
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Aluno</th>
                    <th>Curso</th>
                    <th>Oferta</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="matricula : ${matriculas}">
                    <td th:text="${matricula.id}"></td>
                    <td th:text="${matricula.aluno != null ? matricula.aluno.nome : 'Sem aluno'}"></td>
                    <td th:text="${matricula.curso != null ? matricula.curso.titulo : 'Sem curso'}"></td>
                    <td th:text="${matricula.ofertaDisciplina != null ? matricula.ofertaDisciplina.disciplina.materia : 'Sem oferta'}"></td>
                    <td class="text-end">
                        <a th:href="@{/editarMatricula(id=${matricula.id})}" class="btn btn-outline-secondary btn-icon" title="Editar"><i class="bi bi-pencil-fill"></i></a>
                        <a th:href="@{/excluirMatricula(id=${matricula.id})}" class="btn btn-outline-danger btn-icon" title="Excluir"><i class="bi bi-trash-fill"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(matriculas)}">
                    <td colspan="5" class="text-center text-muted py-4">Nenhuma matrícula cadastrada ainda.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
