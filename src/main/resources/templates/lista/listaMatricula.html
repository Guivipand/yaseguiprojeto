<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Matrículas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Matrículas</h2>
            <p class="text-muted mb-0">Matrículas de alunos em ofertas de disciplina.</p>
        </div>
        <a th:href="@{/formularioMatricula}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nova matrícula</a>
    </div>
    <div class="alert alert-danger" th:if="${erroExclusao}">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>Não foi possível excluir: existem outros registros vinculados a este item.
    </div>
    <div class="card shadow-sm border-0">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Aluno</th>
                    <th>Curso</th>
                    <th>Oferta</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="matricula : ${matriculas}">
                    <td th:text="${matricula.id}"></td>
                    <td th:text="${matricula.aluno != null ? matricula.aluno.nome : 'Sem aluno'}"></td>
                    <td th:text="${matricula.curso != null ? matricula.curso.titulo : 'Sem curso'}"></td>
                    <td th:text="${matricula.ofertaDisciplina != null ? matricula.ofertaDisciplina.disciplina.materia + ' - ' + matricula.ofertaDisciplina.professor.nome : 'Sem oferta'}"></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/editarMatricula(id=${matricula.id})}" class="btn btn-outline-secondary btn-icon" title="Editar"><i class="bi bi-pencil-fill"></i></a>
                        <a th:href="@{/excluirMatricula(id=${matricula.id})}" class="btn btn-outline-danger btn-icon" title="Excluir"
                           onclick="return confirm('Deseja realmente excluir este registro?')"><i class="bi bi-trash-fill"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(matriculas)}">
                    <td colspan="5" class="text-center text-muted py-4">Nenhuma matrícula cadastrada ainda.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
