<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Painel Principal')}"></head>
<body class="pagina-inicio">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container conteudo">
    <header class="saudacao" th:with="pessoa=${#authentication.principal}, role=${pessoa.role?.name()},
            primeiroNome=${#strings.arraySplit(pessoa.nome ?: pessoa.username, ' ')[0]},
            papel=${role == 'ADMIN'} ? 'Administrador' : (${role == 'BIBLIOTECARIO'} ? 'Bibliotecário' : (${role == 'PROFESSOR'} ? 'Professor' : 'Aluno'))">
        <h1>Olá, <span th:text="${primeiroNome}">Nome</span></h1>
        <p><span class="saudacao-papel" th:unless="${papel == primeiroNome}" th:text="${papel}">Papel</span><span class="saudacao-data" th:text="${#temporals.format(#temporals.createToday(), 'EEEE, d ''de'' MMMM')}">data</span></p>
    </header>

    <div class="areas">
        <section class="area" aria-labelledby="area-academico">
            <h2 id="area-academico"><i class="bi bi-building" aria-hidden="true"></i><span>Acadêmico</span></h2>
            <div class="area-grupo">
                <h3>Pessoas</h3>
                <ul class="modulo-lista">
                    <th:block sec:authorize="hasRole('ADMIN')"><li th:replace="~{fragments/layout :: modulo('Usuários', 'Acessos, senhas e fotos de perfil.', 'bi-person-lock', 'tema-curso', '/listaUsuarios')}"></li></th:block>
                    <th:block sec:authorize="hasAnyRole('ADMIN', 'PROFESSOR', 'BIBLIOTECARIO')"><li th:replace="~{fragments/layout :: modulo('Alunos', 'Estudantes, curso e semestre atual.', 'bi-people-fill', 'tema-aluno', '/listaAlunos')}"></li></th:block>
                    <th:block sec:authorize="hasAnyRole('ADMIN', 'PROFESSOR', 'ALUNO')"><li th:replace="~{fragments/layout :: modulo('Professores', 'Docentes, formação e contato.', 'bi-person-badge-fill', 'tema-professor', '/listaProfessores')}"></li></th:block>
                    <th:block sec:authorize="hasRole('ADMIN')"><li th:replace="~{fragments/layout :: modulo('Bibliotecários', 'Equipe da biblioteca e registro CRB.', 'bi-person-workspace', 'tema-bibliotecario', '/listaBibliotecarios')}"></li></th:block>
                </ul>
            </div>
            <div class="area-grupo" sec:authorize="hasAnyRole('ADMIN', 'PROFESSOR', 'ALUNO')">
                <h3>Estrutura acadêmica</h3>
                <ul class="modulo-lista">
                    <li th:replace="~{fragments/layout :: modulo('Cursos', 'Cursos oferecidos e duração em semestres.', 'bi-mortarboard-fill', 'tema-curso', '/listaCursos')}"></li>
                    <li th:replace="~{fragments/layout :: modulo('Disciplinas', 'Matriz curricular por curso e semestre.', 'bi-journal-text', 'tema-disciplina', '/listaDisciplinas')}"></li>
                    <li th:replace="~{fragments/layout :: modulo('Ofertas de disciplina', 'Qual professor ministra cada disciplina.', 'bi-calendar-week-fill', 'tema-oferta', '/listaOfertaDisciplinas')}"></li>
                </ul>
            </div>
            <div class="area-grupo" sec:authorize="hasAnyRole('ADMIN', 'PROFESSOR', 'ALUNO')">
                <h3>Turmas e avaliações</h3>
                <ul class="modulo-lista">
                    <li th:replace="~{fragments/layout :: modulo('Matrículas', 'Inscrições nas ofertas de disciplina.', 'bi-clipboard2-check-fill', 'tema-matricula', '/listaMatriculas')}"></li>
                    <li th:replace="~{fragments/layout :: modulo('Provas', 'Data, conteúdo e peso das avaliações.', 'bi-pencil-square', 'tema-prova', '/listaProvas')}"></li>
                </ul>
            </div>
        </section>

        <section class="area" aria-labelledby="area-biblioteca">
            <h2 id="area-biblioteca"><i class="bi bi-bookshelf" aria-hidden="true"></i><span>Biblioteca</span></h2>
            <div class="area-grupo">
                <h3>Acervo</h3>
                <ul class="modulo-lista">
                    <li th:replace="~{fragments/layout :: modulo('Livros', 'Títulos do acervo com ISBN e capa.', 'bi-book-fill', 'tema-livro', '/listaLivros')}"></li>
                    <th:block sec:authorize="hasAnyRole('ADMIN', 'BIBLIOTECARIO')"><li th:replace="~{fragments/layout :: modulo('Exemplares', 'Cópias físicas identificadas pelo tombo.', 'bi-upc-scan', 'tema-exemplar', '/listaExemplares')}"></li></th:block>
                    <li th:replace="~{fragments/layout :: modulo('Referências', 'Bibliografia indicada por disciplina.', 'bi-bookmark-star-fill', 'tema-referencia', '/listaDisciplinaLivros')}"></li>
                </ul>
            </div>
            <div class="area-grupo" sec:authorize="hasAnyRole('ADMIN', 'ALUNO', 'BIBLIOTECARIO')">
                <h3>Circulação</h3>
                <ul class="modulo-lista">
                    <li th:replace="~{fragments/layout :: modulo('Empréstimos', 'Retiradas, renovações e devoluções.', 'bi-arrow-left-right', 'tema-emprestimo', '/listaEmprestimos')}"></li>
                    <li th:replace="~{fragments/layout :: modulo('Reservas', 'Fila de espera por títulos indisponíveis.', 'bi-hourglass-split', 'tema-reserva', '/listaReservas')}"></li>
                </ul>
            </div>
        </section>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
