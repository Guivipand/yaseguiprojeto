<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de empréstimo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="pagina-form">
<div class="container">
    <div class="card shadow-sm">
        <div class="card-header"><h4 class="mb-0">Cadastrar empréstimo</h4></div>
        <div class="card-body">
            <div class="alert alert-danger" th:if="${erroDataRetirada}">A data de retirada deve ser hoje ou uma data futura.</div>
            <div class="alert alert-danger" th:if="${erroDataPrevista}">A devolução prevista deve ser entre a data de retirada e até uma semana depois.</div>
            <div class="alert alert-danger" th:if="${erroExemplarIndisponivel}">Selecione um exemplar disponível.</div>
            <div class="alert alert-danger" th:if="${erroCamposEmprestimo}">Informe exemplar e aluno.</div>
            <form th:action="@{/cadastrarEmprestimo}" th:object="${emprestimo}" method="post">
                <div class="mb-3">
                    <label class="form-label">Exemplar</label>
                    <select class="form-select" th:field="*{exemplar}" required>
                        <option value="">Selecione o exemplar</option>
                        <option th:each="exemplar : ${exemplares}" th:value="${exemplar.id}" th:text="${exemplar.tombo + ' - ' + exemplar.livro.titulo}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Aluno</label>
                    <select class="form-select" th:field="*{aluno}" required>
                        <option value="">Selecione o aluno</option>
                        <option th:each="aluno : ${alunos}" th:value="${aluno.id}" th:text="${aluno.nome}"></option>
                    </select>
                </div>
                <div class="mb-3"><label class="form-label">Data de retirada</label><input type="date" class="form-control" th:field="*{data_retirada}" th:attr="min=${dataMinima}" required></div>
                <div class="mb-3"><label class="form-label">Data prevista para devolução</label><input type="date" class="form-control" th:field="*{data_prevista}" required></div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/listaEmprestimos}" class="btn btn-secondary">Retornar</a>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    const dataRetirada = document.getElementById("data_retirada");
    const dataPrevista = document.getElementById("data_prevista");
    const sugerirDevolucao = () => {
        if (!dataRetirada.value) return;
        const [ano, mes, dia] = dataRetirada.value.split("-").map(Number);
        const prevista = new Date(ano, mes - 1, dia + 7);
        dataPrevista.value = `${prevista.getFullYear()}-${String(prevista.getMonth() + 1).padStart(2, "0")}-${String(prevista.getDate()).padStart(2, "0")}`;
    };
    dataRetirada.addEventListener("change", sugerirDevolucao);
    if (!dataPrevista.value) sugerirDevolucao();
</script>
</body>
</html>
