<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Professor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="pagina-form">
<div class="container">
    <div class="card shadow-sm">
        <div class="card-header">
            <h4 class="mb-0">Cadastrar Professor</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/cadastrarProfessor}" th:object="${professor}" method="post">
                <div class="mb-3">
                    <label class="form-label">Prontuário</label>
                    <input type="text" class="form-control" th:field="*{prontuario}" placeholder="Digite o prontuário" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control" th:field="*{nome}" placeholder="Digite o nome completo" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Endereço</label>
                    <input type="text" class="form-control" th:field="*{endereco}" placeholder="Digite o endereço" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">CPF</label>
                    <input type="text" class="form-control" th:field="*{cpf}" placeholder="Digite o CPF" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" th:field="*{email}" placeholder="Digite o e-mail" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Telefone</label>
                    <input type="text" class="form-control" th:field="*{telefone}" placeholder="Digite o telefone" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Data de Nascimento</label>
                    <input type="text" class="form-control" th:field="*{dataNasc}" placeholder="DD/MM/AAAA" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Formação</label>
                    <input type="text" class="form-control" th:field="*{formacao}" placeholder="Digite a formação" required>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/listaProfessores}" class="btn btn-secondary">Retornar</a>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
