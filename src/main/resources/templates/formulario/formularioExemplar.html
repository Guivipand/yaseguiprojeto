<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de exemplar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="pagina-form">
<div class="container">
    <div class="card shadow-sm">
        <div class="card-header"><h4 class="mb-0">Cadastrar exemplar</h4></div>
        <div class="card-body">
            <div class="alert alert-danger" th:if="${erroExemplar}">Selecione um livro e informe o tombo do exemplar.</div>
            <form th:action="@{/cadastrarExemplar}" th:object="${exemplar}" method="post">
                <div class="mb-3">
                    <label class="form-label">Livro</label>
                    <select class="form-select" th:field="*{livro}" required>
                        <option value="">Selecione o livro</option>
                        <option th:each="livro : ${livros}" th:value="${livro.id}" th:text="${livro.titulo}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tombo</label>
                    <input type="text" class="form-control" th:field="*{tombo}" required>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/listaExemplares}" class="btn btn-secondary">Retornar</a>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
