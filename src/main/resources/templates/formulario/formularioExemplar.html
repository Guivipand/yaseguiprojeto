<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastrar exemplar')}"></head>
<body class="pagina-form tema-exemplar">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container conteudo conteudo-estreito">
    <header class="cabecalho-pagina">
        <nav aria-label="Trilha de navegação">
            <ol class="trilha">
                <li><a th:href="@{/}">Início</a></li>
                <li><a th:href="@{/listaExemplares}">Exemplares</a></li>
                <li aria-current="page">Cadastrar</li>
            </ol>
        </nav>
        <div class="cabecalho-titulo">
            <span class="selo-entidade" aria-hidden="true"><i class="bi bi-upc-scan"></i></span>
            <div>
                <h1>Cadastrar exemplar</h1>
                <p>Preencha os dados abaixo. Todos os campos são obrigatórios.</p>
            </div>
        </div>
    </header>
    <form class="painel" th:action="@{/cadastrarExemplar}" th:object="${exemplar}" method="post">
        <div class="painel-corpo">
            <div class="alert alert-danger" role="alert" th:if="${erroExemplar}"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span>Selecione um livro e informe o tombo do exemplar.</span></div>
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label" for="livro">Livro</label>
                    <select class="form-select" th:field="*{livro}" required>
                        <option value="">Selecione o livro</option>
                        <option th:each="livro : ${livros}" th:value="${livro.id}" th:text="${livro.titulo}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="tombo">Tombo</label>
                    <input type="text" class="form-control" th:field="*{tombo}" placeholder="Código de patrimônio do exemplar" required>
                </div>
            </div>
        </div>
        <div class="painel-acoes">
            <a th:href="@{/listaExemplares}" class="btn btn-quieto"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Retornar</a>
            <button type="submit" class="btn btn-tema"><i class="bi bi-check-lg me-2" aria-hidden="true"></i>Salvar</button>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
