<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastrar exemplar')}"></head>
<body class="pagina-form">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="card shadow-sm border-0">
        <div class="card-header">
            <h4 class="mb-0"><i class="bi bi-upc-scan me-2"></i>Cadastrar exemplar</h4>
        </div>
        <div class="card-body">
            <div class="alert alert-danger" th:if="${erroExemplar}"><i class="bi bi-exclamation-triangle-fill me-2"></i>Selecione um livro e informe o tombo do exemplar.</div>
            <form th:action="@{/cadastrarExemplar}" th:object="${exemplar}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="livro">Livro</label>
                    <select class="form-select" th:field="*{livro}" required>
                        <option value="">Selecione o livro</option>
                        <option th:each="livro : ${livros}" th:value="${livro.id}" th:text="${livro.titulo}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="tombo">Tombo</label>
                    <input type="text" class="form-control" th:field="*{tombo}" placeholder="Código de patrimônio do exemplar" required>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/listaExemplares}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Retornar</a>
                    <button type="submit" class="btn btn-success"><i class="bi bi-check-lg me-1"></i>Salvar</button>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
