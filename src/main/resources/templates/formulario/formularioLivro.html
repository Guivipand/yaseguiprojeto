<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastrar livro')}"></head>
<body class="pagina-form tema-livro">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container conteudo conteudo-estreito">
    <header class="cabecalho-pagina">
        <nav aria-label="Trilha de navegação">
            <ol class="trilha">
                <li><a th:href="@{/}">Início</a></li>
                <li><a th:href="@{/listaLivros}">Livros</a></li>
                <li aria-current="page">Cadastrar</li>
            </ol>
        </nav>
        <div class="cabecalho-titulo">
            <span class="selo-entidade" aria-hidden="true"><i class="bi bi-book-fill"></i></span>
            <div>
                <h1>Cadastrar livro</h1>
                <p>Preencha os dados abaixo. Todos os campos são obrigatórios.</p>
            </div>
        </div>
    </header>
    <form class="painel" th:action="@{/cadastrarLivro}" th:object="${livro}" enctype="multipart/form-data" method="post">
        <div class="painel-corpo">
            <div class="alert alert-danger" role="alert" th:if="${erroIsbn}"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span>Informe um ISBN-10 ou ISBN-13 válido.</span></div>
            <div class="alert alert-danger" role="alert" th:if="${erroAno}"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span>O ano deve ser maior que zero e não pode ser futuro.</span></div>
            <div class="alert alert-danger" role="alert" th:if="${erroImagem}"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span>Selecione a imagem da capa.</span></div>
            <fieldset class="grupo-campos">
                <legend>Obra</legend>
                <div class="row g-3">
                    <div class="col-md-7">
                        <label class="form-label" for="titulo">Título</label>
                        <input type="text" class="form-control" th:field="*{titulo}" placeholder="Digite o título do livro" required>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label" for="autor">Autor</label>
                        <input type="text" class="form-control" th:field="*{autor}" placeholder="Digite o nome do autor" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="sinopse">Sinopse</label>
                        <textarea class="form-control" th:field="*{sinopse}" rows="4" placeholder="Escreva a sinopse do livro" required></textarea>
                    </div>
                </div>
            </fieldset>
            <fieldset class="grupo-campos">
                <legend>Publicação</legend>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="editora">Editora</label>
                        <input type="text" class="form-control" th:field="*{editora}" placeholder="Digite o nome da editora" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="isbn">ISBN</label>
                        <input type="text" class="form-control" th:field="*{isbn}" placeholder="ISBN-10 ou ISBN-13" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="edicao">Edição</label>
                        <input type="text" class="form-control" th:field="*{edicao}" placeholder="Ex.: 3ª edição" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="ano">Ano</label>
                        <input type="number" class="form-control" th:field="*{ano}" placeholder="Ex.: 2020" min="1" step="1" th:max="${#temporals.year(#temporals.createNow())}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="imagem">Capa</label>
                        <input type="file" class="form-control" id="imagem" name="imagem" accept="image/*" required>
                    </div>
                </div>
            </fieldset>
        </div>
        <div class="painel-acoes">
            <a th:href="@{/listaLivros}" class="btn btn-quieto"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Retornar</a>
            <button type="submit" class="btn btn-tema"><i class="bi bi-check-lg me-2" aria-hidden="true"></i>Salvar</button>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
