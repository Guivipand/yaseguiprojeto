<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de livro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="pagina-form">
<div class="container">
    <div class="card shadow-sm">
        <div class="card-header">
            <h4 class="mb-0">Cadastrar Livro</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/cadastrarLivro}" th:object="${livro}" enctype="multipart/form-data" method="post">
                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" class="form-control" th:field="*{titulo}" placeholder="Digite o título do livro" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Autor</label>
                    <input type="text" class="form-control" th:field="*{autor}" placeholder="Digite o nome do autor" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Editora</label>
                    <input type="text" class="form-control" th:field="*{editora}" placeholder="Digite o nome da editora" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">ISBN</label>
                    <input type="text" class="form-control" th:field="*{isbn}" placeholder="Digite o ISBN" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Edição</label>
                    <input type="text" class="form-control" th:field="*{edicao}" placeholder="Digite a edição" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ano</label>
                    <input type="number" step="1" class="form-control" th:field="*{ano}" placeholder="Digite o ano" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Sinopse</label>
                    <input type="text" class="form-control" th:field="*{sinopse}" placeholder="Escreva a sinopse do livro" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Imagem</label>
                    <input type="file" class="form-control" name="imagem" required>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/listaLivros}" class="btn btn-secondary">Retornar</a>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
