<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Novo usuário')}"></head>
<body class="pagina-form tema-curso">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container conteudo conteudo-estreito">
    <header class="cabecalho-pagina">
        <nav aria-label="Trilha de navegação">
            <ol class="trilha">
                <li><a th:href="@{/}">Início</a></li>
                <li><a th:href="@{/listaUsuarios}">Usuários</a></li>
                <li aria-current="page">Novo</li>
            </ol>
        </nav>
        <div class="cabecalho-titulo">
            <span class="selo-entidade" aria-hidden="true"><i class="bi bi-person-plus-fill"></i></span>
            <div>
                <h1>Novo usuário</h1>
                <p>Crie o acesso de um professor, aluno ou bibliotecário.</p>
            </div>
        </div>
    </header>
    <form class="painel" th:action="@{/cadastrarUsuario}" method="post" enctype="multipart/form-data">
        <div class="painel-corpo">
            <div class="alert alert-danger" role="alert" th:if="${erroUsuario}"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span th:text="${erroUsuario}"></span></div>
            <fieldset class="campo-papel">
                <legend class="form-label">Tipo de perfil</legend>
                <div class="escolha-papel">
                    <input type="radio" class="btn-check" name="role" id="perfilProfessor" value="PROFESSOR" required
                           th:checked="${roleSelecionado != null and roleSelecionado.name() == 'PROFESSOR'}">
                    <label class="opcao-papel tema-professor" for="perfilProfessor">
                        <span class="menu-icone" aria-hidden="true"><i class="bi bi-person-badge-fill"></i></span>Professor
                    </label>
                    <input type="radio" class="btn-check" name="role" id="perfilAluno" value="ALUNO"
                           th:checked="${roleSelecionado == null or roleSelecionado.name() == 'ALUNO'}">
                    <label class="opcao-papel tema-aluno" for="perfilAluno">
                        <span class="menu-icone" aria-hidden="true"><i class="bi bi-people-fill"></i></span>Aluno
                    </label>
                    <input type="radio" class="btn-check" name="role" id="perfilBibliotecario" value="BIBLIOTECARIO"
                           th:checked="${roleSelecionado != null and roleSelecionado.name() == 'BIBLIOTECARIO'}">
                    <label class="opcao-papel tema-bibliotecario" for="perfilBibliotecario">
                        <span class="menu-icone" aria-hidden="true"><i class="bi bi-person-workspace"></i></span>Bibliotecário
                    </label>
                </div>
            </fieldset>
            <div class="row g-3">
                <div class="col-12" id="vinculoBibliotecario">
                    <label class="form-label" for="bibliotecario">Bibliotecário</label>
                    <select class="form-select" id="bibliotecario" name="bibliotecario">
                        <option value="">Selecione o bibliotecário</option>
                        <option th:each="item : ${bibliotecariosSemUsuario}" th:value="${item.id}" th:text="${item.nome + ' - ' + item.prontuario}"
                                th:selected="${bibliotecarioSelecionado == item.id}"></option>
                    </select>
                </div>
                <div class="col-12" id="vinculoAluno">
                    <label class="form-label" for="aluno">Aluno</label>
                    <select class="form-select" id="aluno" name="aluno">
                        <option value="">Selecione o aluno</option>
                        <option th:each="item : ${alunosSemUsuario}" th:value="${item.id}" th:text="${item.nome + ' - ' + item.idMatricula}"
                                th:selected="${alunoSelecionado == item.id}"></option>
                    </select>
                </div>
                <div class="col-12" id="vinculoProfessor">
                    <label class="form-label" for="professor">Professor</label>
                    <select class="form-select" id="professor" name="professor">
                        <option value="">Selecione o professor</option>
                        <option th:each="item : ${professoresSemUsuario}" th:value="${item.id}" th:text="${item.nome + ' - ' + item.prontuario}"
                                th:selected="${professorSelecionado == item.id}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="username">Login</label>
                    <input type="text" class="form-control" id="username" name="username" th:value="${username}" placeholder="Digite o login" autocomplete="off" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="password">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Digite a senha" autocomplete="new-password" required>
                </div>
                <div class="col-12">
                    <label class="form-label" for="foto">Foto de perfil</label>
                    <input type="file" class="form-control" id="foto" name="foto" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
                </div>
            </div>
        </div>
        <div class="painel-acoes">
            <a th:href="@{/listaUsuarios}" class="btn btn-quieto"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Retornar</a>
            <button type="submit" class="btn btn-tema"><i class="bi bi-check-lg me-2" aria-hidden="true"></i>Cadastrar</button>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    const vinculos = {
        BIBLIOTECARIO: document.getElementById("vinculoBibliotecario"),
        ALUNO: document.getElementById("vinculoAluno"),
        PROFESSOR: document.getElementById("vinculoProfessor")
    };
    const atualizarVinculo = () => {
        const papel = document.querySelector("input[name='role']:checked")?.value;
        Object.entries(vinculos).forEach(([tipo, bloco]) => {
            const ativo = tipo === papel;
            const campo = bloco.querySelector("select");
            bloco.hidden = !ativo;
            campo.disabled = !ativo;
            campo.required = ativo;
        });
    };
    document.querySelectorAll("input[name='role']").forEach(opcao => opcao.addEventListener("change", atualizarVinculo));
    atualizarVinculo();
</script>
</body>
</html>
