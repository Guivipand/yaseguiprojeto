<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Disciplina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .container { max-width: 760px; margin-top: 40px; }
        .card-header { background-color: #3457D5; color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <div class="card shadow-sm">
        <div class="card-header">
            <h4 class="mb-0">Cadastrar Disciplina</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/cadastrarDisciplina}" th:object="${disciplina}" method="post">
                <div class="mb-3">
                    <label class="form-label">Matéria</label>
                    <input type="text" class="form-control" th:field="*{materia}" placeholder="Digite o nome da disciplina" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Semestre</label>
                    <input type="text" class="form-control" th:field="*{semestre}" placeholder="Digite o semestre" required>
                </div>
                 <div class="mb-3">
                    <label class="form-label">Curso</label>
                    <select class="form-select" th:field="*{curso}">
                        <option value="">Selecione o curso</option>
                        <option th:each="curso : ${cursos}" th:value="${curso.id}" th:text="${curso.titulo}"></option>
                    </select>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/listaDisciplinas}" class="btn btn-secondary">Retornar</a>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
