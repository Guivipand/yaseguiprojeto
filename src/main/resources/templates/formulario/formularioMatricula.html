<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Matrícula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="pagina-form">
<div class="container">
    <div class="card shadow-sm">
        <div class="card-header">
            <h4 class="mb-0">Cadastrar Matrícula</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/cadastrarMatricula}" th:object="${matricula}" method="post">
                <div class="mb-3">
                    <label class="form-label">Aluno</label>
                    <select class="form-select" th:field="*{aluno}">
                        <option value="">Selecione o aluno</option>
                        <option th:each="aluno : ${alunos}" th:value="${aluno.id}" th:text="${aluno.nome}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Curso</label>
                    <select class="form-select" th:field="*{curso}">
                        <option value="">Selecione o curso</option>
                        <option th:each="curso : ${cursos}" th:value="${curso.id}" th:text="${curso.titulo}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Oferta de Disciplina</label>
                    <select class="form-select" th:field="*{ofertaDisciplina}">
                        <option value="">Selecione a oferta</option>
                        <option th:each="oferta : ${ofertasDisciplina}" th:value="${oferta.id}" th:text="${oferta.disciplina.materia + ' - ' + oferta.professor.nome}"></option>
                    </select>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/listaMatriculas}" class="btn btn-secondary">Retornar</a>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
