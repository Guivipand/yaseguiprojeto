<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastrar matrícula')}"></head>
<body class="pagina-form tema-matricula">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container conteudo conteudo-estreito">
    <header class="cabecalho-pagina">
        <nav aria-label="Trilha de navegação">
            <ol class="trilha">
                <li><a th:href="@{/}">Início</a></li>
                <li><a th:href="@{/listaMatriculas}">Matrículas</a></li>
                <li aria-current="page">Cadastrar</li>
            </ol>
        </nav>
        <div class="cabecalho-titulo">
            <span class="selo-entidade" aria-hidden="true"><i class="bi bi-clipboard2-check-fill"></i></span>
            <div>
                <h1>Cadastrar matrícula</h1>
                <p>Preencha os dados abaixo. Todos os campos são obrigatórios.</p>
            </div>
        </div>
    </header>
    <form class="painel" th:action="@{/cadastrarMatricula}" th:object="${matricula}" method="post">
        <div class="painel-corpo">
            <div class="alert alert-danger" role="alert" th:if="${erroValidacao}"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span>Selecione o aluno, o curso e a oferta de disciplina.</span></div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="aluno">Aluno</label>
                    <select class="form-select" th:field="*{aluno}" required>
                        <option value="">Selecione o aluno</option>
                        <option th:each="aluno : ${alunos}" th:value="${aluno.id}" th:text="${aluno.nome}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="curso">Curso</label>
                    <select class="form-select" th:field="*{curso}" required>
                        <option value="">Selecione o curso</option>
                        <option th:each="curso : ${cursos}" th:value="${curso.id}" th:text="${curso.titulo}"></option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label" for="ofertaDisciplina">Oferta de Disciplina</label>
                    <select class="form-select" th:field="*{ofertaDisciplina}" required>
                        <option value="">Selecione a oferta</option>
                        <option th:each="oferta : ${ofertasDisciplina}" th:value="${oferta.id}" th:text="${oferta.disciplina.materia + ' - ' + oferta.professor.nome}"></option>
                    </select>
                </div>
            </div>
        </div>
        <div class="painel-acoes">
            <a th:href="@{/listaMatriculas}" class="btn btn-quieto"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Retornar</a>
            <button type="submit" class="btn btn-tema"><i class="bi bi-check-lg me-2" aria-hidden="true"></i>Salvar</button>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
