<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastrar oferta de disciplina')}"></head>
<body class="pagina-form">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="card shadow-sm border-0">
        <div class="card-header">
            <h4 class="mb-0"><i class="bi bi-calendar-week-fill me-2"></i>Cadastrar oferta de disciplina</h4>
        </div>
        <div class="card-body">
            <div class="alert alert-danger" th:if="${erroValidacao}"><i class="bi bi-exclamation-triangle-fill me-2"></i>Selecione a disciplina e o professor.</div>
            <form th:action="@{/cadastrarOfertaDisciplina}" th:object="${ofertaDisciplina}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="disciplina">Disciplina</label>
                    <select class="form-select" th:field="*{disciplina}" required>
                        <option value="">Selecione a disciplina</option>
                        <option th:each="disciplina : ${disciplinas}" th:value="${disciplina.id}" th:text="${disciplina.materia}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="professor">Professor</label>
                    <select class="form-select" th:field="*{professor}" required>
                        <option value="">Selecione o professor</option>
                        <option th:each="professor : ${professores}" th:value="${professor.id}" th:text="${professor.nome}"></option>
                    </select>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/listaOfertaDisciplinas}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Retornar</a>
                    <button type="submit" class="btn btn-success"><i class="bi bi-check-lg me-1"></i>Salvar</button>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
